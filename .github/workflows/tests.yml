# Runs on every push and pull request. Render is set to deploy only after this passes
# (Render → founderreach → Settings → Auto-Deploy: "After CI Checks Pass").
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as Render (render.yaml PYTHON_VERSION)
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests (fake AI, no network, no real alerts or email)
        run: python -m pytest -q
      - name: Known vulnerabilities in dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
