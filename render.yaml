# Render blueprint for founderreach.in (Render dashboard → New → Blueprint → pick this repo).
# One web service. It must stay a single instance: the scheduler runs inside it.
# SQLite lives on a small persistent disk, so data survives deploys and restarts.
services:
  - type: web
    name: founderreach
    runtime: python
    plan: starter            # paid plans keep running; free ones sleep, which stops the daily jobs
    region: singapore        # closest to Bengaluru
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers  # client IP: app.main.client_ip
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BASE_URL
        value: https://founderreach.in
      - key: DATABASE_URL
        value: sqlite:////var/data/founderreach.db
      - key: SECRET_KEY
        generateValue: true  # Render makes a random one; never reuse your local key
      - key: LLM_PROVIDER
        value: anthropic
      - key: TRUSTED_PROXY_HOPS   # Cloudflare + Render's load balancer each append to X-Forwarded-For
        value: "2"
      - key: BUSINESS_NAME
        value: Gowtham R Gowda
      - key: SUPPORT_EMAIL
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: ADMIN_EMAILS     # your sign-in email: lets you refresh the startup pool
        sync: false
      # Secrets: Render asks for these when the blueprint is created (sync: false = not stored in git)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      # PhonePe Payment Gateway: payments and the trial limits stay off until the client id and secret are set
      - key: PHONEPE_ENV          # "sandbox" while testing, "production" for real money
        value: sandbox
      - key: PHONEPE_CLIENT_ID
        sync: false
      - key: PHONEPE_CLIENT_SECRET
        sync: false
      - key: PHONEPE_CLIENT_VERSION
        sync: false
      - key: PHONEPE_WEBHOOK_USER
        sync: false
      - key: PHONEPE_WEBHOOK_PASSWORD
        sync: false
      - key: CF_ANALYTICS_TOKEN   # Cloudflare Web Analytics site token (public, shows in the page)
        sync: false
